name: Python

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # patch-coverage PR comment

jobs:
  python:
    uses: svaningelgem/ci-workflows/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      total-coverage: 100
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonarcloud:
    name: Analyze
    needs: python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate new-code / blame data

      - uses: actions/download-artifact@v8
        with:
          name: merged-coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  generate-stubs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Generate stubs
        run: |
          uv sync --locked
          uv run --no-sync ./restub

      - name: Commit and push changes
        run: |
          if git diff --quiet src/smartschool; then
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/smartschool
          git commit -m "Auto-update stub files"
          git push
