name: Python

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # patch-coverage PR comment

jobs:
  python:
    uses: svaningelgem/ci-workflows/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      windows: true
      macos: true
      pylint: true
      ty: true
      total-coverage: 100
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonarcloud:
    name: Analyze
    needs: python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate new-code / blame data

      - uses: actions/download-artifact@v8
        with:
          name: merged-coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  stubs:
    name: Stubs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate the stubs
        run: |
          uv sync --locked
          uv run --no-sync ./restub

      - name: Fail when they changed
        run: |
          if [ -n "$(git status --porcelain -- stubs)" ]; then
            git status --short -- stubs
            echo "::error::stubs/ is out of date: run ./restub and commit the result."
            exit 1
          fi

  public-api:
    name: Public API stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Type-check public usage against the built wheel
        run: dev/check_public_api.sh
